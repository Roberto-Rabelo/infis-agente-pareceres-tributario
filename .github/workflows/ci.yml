name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Testes Api.Agente
        run: dotnet test tests/Api.Agente.Tests/Api.Agente.Tests.csproj --configuration Release
      - name: Testes Api.RAG
        run: dotnet test tests/Api.RAG.Tests/Api.RAG.Tests.csproj --configuration Release
      - name: Publish agente (mesmo alvo do Dockerfile.vercel)
        run: dotnet publish src/Api.Agente/Api.Agente.csproj -c Release -o /tmp/agente /p:UseAppHost=false
