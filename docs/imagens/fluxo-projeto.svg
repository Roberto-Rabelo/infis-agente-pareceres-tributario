<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .s { font-size: 12px; fill: #333; }
      .h { font-size: 17px; font-weight: 700; }
      .seta { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .pend { stroke-dasharray: 7 5; }
      .passo { fill: #ffffff; stroke: #3060c0; stroke-width: 1.4; rx: 8; }
      .rag { fill: #ffffff; stroke: #2a8a4a; stroke-width: 1.4; rx: 8; }
      .ext { fill: #fff7e6; stroke: #c08020; stroke-width: 1.4; rx: 8; }
      .art { fill: #f4f4f4; stroke: #888; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect width="1700" height="960" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#1a1a1a">infis-agente-parecer-tributário – fluxo de uma análise de cruzamento</text>
  <text x="30" y="66" class="s">Linha contínua: implementado e testado. Tracejado: depende de configuração ou está pendente.</text>

  <!-- Coluna de entrada / artefatos -->
  <rect x="30" y="150" width="230" height="90" class="ext"/>
  <text x="45" y="178" class="t">Agentes de origem</text>
  <text x="45" y="198" class="s">já validaram o leiaute de cada</text>
  <text x="45" y="214" class="s">obrigação; enviam lote JSON +</text>
  <text x="45" y="230" class="s">relatório de validação</text>

  <rect x="30" y="250" width="230" height="70" class="art"/>
  <text x="45" y="278" class="t">contracts/entrada/</text>
  <text x="45" y="298" class="s">lote.v1.schema.json</text>

  <rect x="30" y="350" width="230" height="70" class="art"/>
  <text x="45" y="378" class="t">catalog/</text>
  <text x="45" y="398" class="s">versoes-layout.json, regras.json</text>

  <rect x="30" y="450" width="230" height="70" class="art"/>
  <text x="45" y="478" class="t">catalog/regras.json</text>
  <text x="45" y="498" class="s">hoje: só PRE-001 a 005 aprovadas</text>

  <rect x="30" y="650" width="230" height="90" class="art"/>
  <text x="45" y="678" class="t">prompts/parecer/v1.0.0.md</text>
  <text x="45" y="698" class="s">contracts/saida/</text>
  <text x="45" y="714" class="s">parecer.v1.schema.json</text>

  <rect x="30" y="830" width="230" height="90" class="ext"/>
  <text x="45" y="858" class="t">Orquestrador / revisor</text>
  <text x="45" y="878" class="s">recebe o envelope; revisão</text>
  <text x="45" y="894" class="s">humana obrigatória quando</text>
  <text x="45" y="910" class="s">indicada (P15)</text>

  <!-- Api.Agente -->
  <rect x="290" y="95" width="610" height="845" rx="12" fill="#eef4ff" stroke="#3060c0" stroke-width="2"/>
  <text x="310" y="124" class="h" fill="#3060c0">Api.Agente  ·  POST /api/v1/analises  ·  http://localhost:5117</text>

  <rect x="320" y="150" width="550" height="70" class="passo"/>
  <text x="335" y="177" class="t">1. Autenticação JWT + X-Correlation-Id</text>
  <text x="335" y="198" class="s">sem Autenticacao:Authority nenhum token é aceito (401, falha fechada)</text>

  <rect x="320" y="250" width="550" height="70" class="passo"/>
  <text x="335" y="277" class="t">2. Leitura do lote (contrato v1)</text>
  <text x="335" y="298" class="s">schema, limites de tamanho/profundidade, CNPJ (inclusive alfanumérico), período</text>

  <rect x="320" y="350" width="550" height="70" class="passo"/>
  <text x="335" y="377" class="t">3. Pré-condições e aptidão de cada obrigação</text>
  <text x="335" y="398" class="s">validação de origem, versão de leiaute vigente, recibo → PRE_CONDICAO_NAO_ATENDIDA</text>

  <rect x="320" y="450" width="550" height="70" class="passo"/>
  <text x="335" y="477" class="t">4. Motor de regras determinístico</text>
  <text x="335" y="498" class="s">casamento entre obrigações e comparação → achados (natureza, severidade, evidências)</text>

  <rect x="320" y="550" width="550" height="70" class="passo"/>
  <text x="335" y="577" class="t">5. Fundamentação (ServicoFundamentacao)</text>
  <text x="335" y="598" class="s">busca, por MCP, os trechos das regras que geraram achados; falha → limitação</text>

  <rect x="320" y="650" width="550" height="70" class="passo pend"/>
  <text x="335" y="677" class="t">6. Parecer por LLM (Semantic Kernel) – desabilitado por padrão</text>
  <text x="335" y="698" class="s">prompt + dados delimitados; 1 ferramenta controlada (lista de permissão, limite 3)</text>

  <rect x="320" y="750" width="550" height="70" class="passo"/>
  <text x="335" y="777" class="t">7. Validação do parecer + retentativas</text>
  <text x="335" y="798" class="s">schema + semântica (não reclassifica achados); esgotou → FALHA_TECNICA</text>

  <rect x="320" y="850" width="550" height="70" class="passo"/>
  <text x="335" y="877" class="t">8. Envelope 1.1.0</text>
  <text x="335" y="898" class="s">status, achados, fundamentação, parecer, trechos citados, consumo, limitações</text>

  <!-- setas internas Api.Agente -->
  <path d="M595,220 V250" class="seta"/>
  <path d="M595,320 V350" class="seta"/>
  <path d="M595,420 V450" class="seta"/>
  <path d="M595,520 V550" class="seta"/>
  <path d="M595,620 V650" class="seta"/>
  <path d="M595,720 V750" class="seta"/>
  <path d="M595,820 V850" class="seta"/>

  <!-- entradas e saída -->
  <path d="M260,195 H320" class="seta"/>
  <path d="M260,285 H320" class="seta"/>
  <path d="M260,385 H320" class="seta"/>
  <path d="M260,485 H320" class="seta"/>
  <path d="M260,695 H320" class="seta"/>
  <path d="M320,885 H260" class="seta"/>

  <!-- externos da Api.Agente -->
  <rect x="930" y="690" width="220" height="80" class="ext pend"/>
  <text x="945" y="716" class="t">OpenAI – chat</text>
  <text x="945" y="736" class="s">saída estruturada estrita</text>
  <text x="945" y="752" class="s">modelo a definir (ADR D10)</text>
  <path d="M870,705 L930,725" class="seta pend"/>

  <rect x="930" y="800" width="220" height="80" class="ext pend"/>
  <text x="945" y="826" class="t">PostgreSQL (Agente)</text>
  <text x="945" y="846" class="s">agente_consumo_llm: 1 linha</text>
  <text x="945" y="862" class="s">por chamada (ADR D17)</text>
  <path d="M870,800 L930,835" class="seta pend"/>

  <!-- trilhas MCP -->
  <path d="M870,585 H1190 V185 H1230" class="seta"/>
  <path d="M870,665 H1178 V200 H1230" class="seta pend"/>
  <text x="935" y="578" class="s">MCP Streamable HTTP (token rag.consulta)</text>
  <text x="935" y="658" class="s">ferramenta chamada pelo LLM</text>

  <!-- Api.RAG -->
  <text x="1450" y="18" class="s"> </text>
  <rect x="1420" y="20" width="250" height="62" class="art pend"/>
  <text x="1432" y="42" class="t">scripts/ingerir-base-regras.ps1</text>
  <text x="1432" y="60" class="s">docs/*.md → BASE_REGRAS_INTERNA</text>
  <text x="1432" y="75" class="s">(ainda não executado)</text>
  <path d="M1560,82 V145" class="seta pend"/>

  <rect x="1210" y="100" width="460" height="345" rx="12" fill="#eefaf0" stroke="#2a8a4a" stroke-width="2"/>
  <text x="1225" y="126" class="h" fill="#2a8a4a">Api.RAG · localhost:5203</text>

  <rect x="1230" y="145" width="200" height="90" class="rag"/>
  <text x="1242" y="170" class="t">MCP /mcp</text>
  <text x="1242" y="190" class="s">consultar_base_</text>
  <text x="1242" y="205" class="s">conhecimento</text>
  <text x="1242" y="222" class="s">papel rag.consulta</text>

  <rect x="1450" y="145" width="200" height="90" class="rag"/>
  <text x="1462" y="170" class="t">REST documentos</text>
  <text x="1462" y="190" class="s">POST/GET /api/v1/</text>
  <text x="1462" y="205" class="s">documentos</text>
  <text x="1462" y="222" class="s">papel rag.admin</text>

  <rect x="1230" y="275" width="200" height="145" class="rag"/>
  <text x="1242" y="300" class="t">ServicoConsulta</text>
  <text x="1242" y="320" class="s">1) busca exata por regraIds</text>
  <text x="1242" y="337" class="s">2) busca semântica</text>
  <text x="1242" y="352" class="s">(embedding da pergunta)</text>
  <text x="1242" y="369" class="s">filtros: obrigação, tipo,</text>
  <text x="1242" y="384" class="s">vigência; devolve trechoId</text>
  <text x="1242" y="401" class="s">e consumo</text>

  <rect x="1450" y="275" width="200" height="145" class="rag"/>
  <text x="1462" y="300" class="t">ServicoIngestao</text>
  <text x="1462" y="320" class="s">segmenta Markdown</text>
  <text x="1462" y="337" class="s">(1 linha de tabela = 1 trecho)</text>
  <text x="1462" y="354" class="s">gera embeddings em lotes</text>
  <text x="1462" y="371" class="s">versão + hash: idempotente;</text>
  <text x="1462" y="388" class="s">nova versão substitui</text>

  <path d="M1330,235 V275" class="seta"/>
  <path d="M1550,235 V275" class="seta"/>

  <rect x="1230" y="490" width="200" height="105" class="ext pend"/>
  <text x="1242" y="515" class="t">PostgreSQL + PgVector</text>
  <text x="1242" y="535" class="s">rag_documentos, rag_trechos</text>
  <text x="1242" y="551" class="s">rag_consumo_embeddings</text>
  <text x="1242" y="571" class="s">docker-compose.rag.yml (5433)</text>
  <text x="1242" y="587" class="s" fill="#b03030">hoje: vazio</text>

  <rect x="1450" y="490" width="200" height="105" class="ext pend"/>
  <text x="1462" y="515" class="t">OpenAI – embeddings</text>
  <text x="1462" y="535" class="s">text-embedding-3-small</text>
  <text x="1462" y="551" class="s">1536 dimensões (ADR D11)</text>
  <text x="1462" y="571" class="s">precisa de OpenAI__ApiKey</text>

  <path d="M1330,420 V490" class="seta pend"/>
  <path d="M1590,420 V490" class="seta pend"/>
  <path d="M1470,420 L1420,490" class="seta pend"/>

  <!-- Pendências -->
  <rect x="930" y="630" width="0" height="0"/>
  <rect x="1210" y="640" width="460" height="290" rx="12" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1225" y="668" class="h">Para rodar ponta a ponta falta</text>
  <text x="1225" y="696" class="s">• Provedor de identidade (OIDC) emitindo tokens com papéis</text>
  <text x="1239" y="713" class="s">rag.admin / rag.consulta – ADR D15 pendente</text>
  <text x="1225" y="737" class="s">• Docker Desktop + PostgreSQL/PgVector em execução</text>
  <text x="1225" y="761" class="s">• Chave OpenAI (embeddings e, se habilitado, parecer)</text>
  <text x="1225" y="785" class="s">• Executar a ingestão de docs/*.md</text>
  <text x="1225" y="809" class="s">• Escolher Parecer:Modelo e ligar Parecer:Habilitado</text>
  <text x="1225" y="833" class="s">• Manuais oficiais (MANUAL_OFICIAL) – curadoria T011</text>
  <text x="1225" y="857" class="s">• Validadores CRZ ainda não aprovados no catálogo:</text>
  <text x="1239" y="874" class="s">hoje o motor só emite achados de pré-condição</text>
  <text x="1225" y="898" class="s">• Avaliações reais T065/T075 (eval/) com a chave</text>
</svg>
